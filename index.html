<style>
  :root {
    --bg: #000000;
    --panel: #0B0C0E;
    --white: #FFFFFF;
    --gray: #A3A3A3;
    --dim: #5C5C5C;
    --line: #232428;
    --sidebar-w: 350px;
    --sans: 'Inter', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif;
    --mono: 'Space Mono', 'Courier New', Courier, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overscroll-behavior: none; }
  body {
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
    background: var(--bg);
    color: var(--white);
    font-family: var(--sans);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--white); color: var(--bg); }

  /* ---------- STAGE (graph) ---------- */
  #stage {
    position: fixed;
    inset: 0 var(--sidebar-w) 0 0;
    background: var(--bg);
    cursor: grab;
    touch-action: none;                 /* touch gestures go to the map, never to the page */
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  }
  #stage:active { cursor: grabbing; }
  #stage svg { width: 100%; height: 100%; display: block; }

  /* architectural guide lines */
  .grid line { stroke: #111214; stroke-width: 1; }
  .crosshair { stroke: #1A1B1E; stroke-width: 1; }

  /* cluster outlines + titles (drawn under the lines) */
  .halo path { fill: rgba(255,255,255,.028); stroke: #2C2E33; stroke-width: 1; stroke-dasharray: 3 4; }
  .halo text {
    font-family: var(--mono); font-size: 11px; font-weight: 700; letter-spacing: .12em;
    fill: #7D828C; text-anchor: middle; pointer-events: none;
    paint-order: stroke; stroke: var(--bg); stroke-width: 5px; stroke-linejoin: round;
  }
  .halo text.t { pointer-events: auto; cursor: zoom-in; }
  .halo text.t:hover { fill: var(--white); }
  .halo.hidden { display: none; }
  body.view-free .halo { display: none; }

  /* view switch (Grupos | Libre), left of the filter button */
  #filter { display: flex; gap: 8px; align-items: flex-start; }
  #viewSw { display: flex; border: 1px solid var(--dim); height: 28px; }
  #viewSw button {
    background: var(--bg); border: none; color: var(--gray); cursor: pointer;
    font-family: var(--mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase;
    padding: 0 10px;
  }
  #viewSw button + button { border-left: 1px solid var(--dim); }
  #viewSw button:hover { color: var(--white); }
  #viewSw button[aria-pressed="true"] { background: var(--white); color: var(--bg); font-weight: 700; }

  .link {
    stroke: var(--white);
    stroke-width: var(--w, 1.8);          /* set per line: thinner when its nodes have many connections */
    stroke-linecap: square;
    fill: none;
    opacity: .5;
    transition: opacity .35s, stroke-width .2s;
  }
  .link-flow {
    stroke: var(--bg);
    stroke-width: var(--fw, 1.2);
    stroke-dasharray: 2 14;
    fill: none;
    pointer-events: none;
    animation: flow 1.6s linear infinite;
    transition: opacity .35s;
  }
  @keyframes flow { to { stroke-dashoffset: -32; } }
  .l:not(.money) .link { stroke: #8A8F98; stroke-dasharray: 4 4; opacity: .55; }
  .l:not(.money) .link-flow { display: none; }
  .l.money .link { opacity: .7; }
  .l.lit:not(.money) .link { stroke: #C9CDD3; }
  .link-hit { stroke: transparent; stroke-width: 18; fill: none; cursor: pointer; }
  .link.hover { stroke-width: 4; opacity: 1; }
  .l.lit .link { opacity: 1; stroke-width: calc(var(--w, 1.8) + 1px); }

  .node { cursor: pointer; transition: opacity .35s; outline: none; }
  .node:focus-visible .ring { stroke-width: 4; stroke-dasharray: 2 3; }
  .node .ring {
    fill: var(--bg);
    stroke: var(--white);
    stroke-width: 2.4;
    transition: stroke-width .2s;
  }
  .node .ring-outer { fill: none; stroke: var(--white); stroke-width: 1; }
  .node .core { fill: var(--white); }
  .node.offshore .ring { stroke-dasharray: 5 4; }
  .node.state .ring-outer { stroke-dasharray: 1 4; }
  .node:hover .ring, .node.active .ring { stroke-width: 4; }
  .node.satellite .ring { fill: var(--white); }
  .node.satellite .core { fill: var(--bg); }
  .node.pending .ring { stroke-dasharray: 2 3; }
  .node.pending .label { fill: var(--gray); }
  .node .label {
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: .03em;
    fill: var(--white);
    text-anchor: middle;
    pointer-events: none;
    paint-order: stroke;
    stroke: var(--bg);
    stroke-width: 5px;
    stroke-linejoin: round;
  }
  .node .code {
    font-family: var(--mono);
    font-size: 9px;
    fill: var(--dim);
    text-anchor: middle;
    pointer-events: none;
    letter-spacing: .12em;
    opacity: 0;
    transition: opacity .15s;
  }
  .node:hover .code, .node.active .code { opacity: 1; fill: var(--gray); }
  .node.hub .label { font-family: var(--sans); font-weight: 900; font-size: 15px; letter-spacing: .02em; text-transform: uppercase; }

  .dimmed { opacity: .12; }
  .node.hidden, .l.hidden { opacity: 0 !important; pointer-events: none; }

  /* ---------- FILTER dropdown (top right of the map) ---------- */
  #filter {
    position: fixed;
    right: calc(var(--sidebar-w) + 24px); top: 18px;
    z-index: 12;
    font-family: var(--mono);
  }
  #filterBtn {
    display: flex; align-items: center; justify-content: center;
    background: var(--bg); border: 1px solid var(--dim); color: var(--gray);
    font-family: var(--mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase;
    width: 32px; height: 28px; padding: 0; cursor: pointer;
  }
  #filterBtn:hover, #filterBtn[aria-expanded="true"] { border-color: var(--white); color: var(--white); }
  /* "+" call to action: opens the GitHub "new link or correction" form */
  #addBtn {
    display: flex; align-items: center; justify-content: center;
    background: var(--bg); border: 1px solid var(--dim); color: var(--gray);
    width: 32px; height: 28px; text-decoration: none; cursor: pointer;
  }
  #addBtn:hover { background: var(--white); border-color: var(--white); color: var(--bg); }
  #addBtn:focus-visible { outline: 1px dashed var(--white); outline-offset: 2px; }
  #filterBtn.on { background: var(--white); border-color: var(--white); color: var(--bg); font-weight: 700; }
  #filterPanel {
    position: absolute; right: 0; top: calc(100% + 6px);
    width: 290px; max-height: calc(100vh - 90px); overflow-y: auto;
    background: var(--panel); border: 1px solid var(--white);
    box-shadow: 0 24px 40px rgba(0,0,0,.85);
    font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--gray);
    scrollbar-width: thin; scrollbar-color: var(--dim) transparent;
  }
  #filterPanel[hidden] { display: none; }
  #filterPanel .f-head { padding: 12px 14px 4px; font-size: 9.5px; color: var(--dim); letter-spacing: .14em; }
  #filterPanel .f-row { display: flex; align-items: center; gap: 9px; padding: 5px 14px; cursor: pointer; }
  #filterPanel .f-row:hover { background: #17181B; color: var(--white); }
  #filterPanel .f-row:has(input:checked) { color: var(--white); }
  #filterPanel .f-row input {
    appearance: none; -webkit-appearance: none; margin: 0; flex: none; cursor: pointer;
    width: 12px; height: 12px; border: 1px solid var(--gray); background: none;
  }
  #filterPanel .f-row input:checked { background: var(--white); border-color: var(--white); box-shadow: inset 0 0 0 2px var(--panel); }
  #filterPanel .f-row input:focus-visible { outline: 1px dashed var(--white); outline-offset: 2px; }
  #filterPanel .f-dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  #filterPanel .f-name { flex: 1; min-width: 0; }
  #filterPanel .f-name small { display: block; font-size: 9px; color: var(--dim); text-transform: none; letter-spacing: .02em; margin-top: 2px; }
  #filterPanel .f-n { color: var(--dim); font-size: 9.5px; }
  #filterPanel .f-foot {
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
    margin-top: 8px; padding: 10px 14px; border-top: 1px solid var(--line); font-size: 9.5px; color: var(--dim);
  }

  /* ---------- HEADER (minimal) ---------- */
  header {
    position: fixed;
    top: 20px; left: 24px;
    z-index: 5;
    pointer-events: none;
    display: flex;
    align-items: center;
    gap: 10px;
    opacity: .85;
  }
  header img { width: 26px; height: auto; display: block; }
  header .kicker {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--gray);
    display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
  }
  header .kicker .sep { color: var(--dim); }

  /* footer legend on the stage: one row (shapes + color dots) */
  #legend {
    position: fixed;
    left: 24px; bottom: 20px;
    z-index: 5;
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--gray);
    display: flex; gap: 8px 15px; flex-wrap: wrap; align-items: center;
    max-width: calc(100vw - var(--sidebar-w) - 48px);
    pointer-events: none;
  }
  #legend .item { display: flex; align-items: center; gap: 8px; }
  #legend .head { color: var(--dim); }
  #legend .sep { width: 1px; height: 14px; background: var(--line); }
  #legend .dots { display: flex; align-items: center; gap: 4px; pointer-events: auto; }
  #legend i.dot {
    width: 12px; height: 12px; border-radius: 50%; display: inline-block; flex: none;
    cursor: pointer; transition: transform .15s, box-shadow .15s;
  }
  #legend i.dot:hover, #legend i.dot:focus-visible { transform: scale(1.35); box-shadow: 0 0 0 3px rgba(255,255,255,.18); outline: none; }
  #legend i.dot.on { box-shadow: 0 0 0 2px var(--bg), 0 0 0 3.5px var(--white); transform: scale(1.2); }
  /* shape items are pre-set filters: hover lights them up, click toggles the filter */
  #legend .item.pick {
    pointer-events: auto; cursor: pointer;
    padding: 3px 7px; margin: -3px -7px; border: 1px solid transparent;
    transition: color .15s, background .15s, border-color .15s;
  }
  #legend .item.pick:hover, #legend .item.pick:focus-visible { color: var(--white); background: #17181B; outline: none; }
  #legend .item.pick.on { color: var(--white); border-color: var(--white); }
  #legend svg { overflow: visible; }
  /* tooltip for links */
  #tip {
    position: fixed;
    z-index: 20;
    pointer-events: none;
    max-width: 280px;
    background: var(--panel);
    border: 1px solid var(--white);
    padding: 10px 12px;
    font-family: var(--mono);
    font-size: 11px;
    line-height: 1.5;
    color: var(--white);
    opacity: 0;
    transform: translateY(4px);
    transition: opacity .15s, transform .15s;
  }
  #tip.show { opacity: 1; transform: none; }
  #tip .t-src { margin-top: 8px; padding-top: 6px; border-top: 1px dashed var(--dim); color: var(--gray); font-size: 10px; letter-spacing: .06em; }
  #tip .amt { background: var(--white); color: var(--bg); font-weight: 700; padding: 0 3px; }
  #tip .t-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 7px; vertical-align: 0; }
  #tip .t-name { font-family: var(--sans); font-weight: 900; font-size: 14px; letter-spacing: -.01em; text-transform: uppercase; line-height: 1.15; margin-bottom: 4px; }
  #tip .t-row { color: var(--gray); font-size: 10.5px; }
  #tip .t-row b { color: var(--white); font-weight: 400; }
  #tip .t-amt .amt { display: inline-block; margin: 3px 4px 0 0; }
  #tip .t-amt { margin-top: 8px; padding-top: 6px; border-top: 1px dashed var(--dim); font-size: 10.5px; }
  #tip .t-head { color: var(--gray); font-size: 9.5px; letter-spacing: .12em; text-transform: uppercase; margin-bottom: 6px; border-bottom: 1px dashed var(--dim); padding-bottom: 6px; }

  /* ---------- SIDEBAR / TERMINAL ---------- */
  aside {
    position: fixed;
    top: 0; right: 0; bottom: 0;
    width: var(--sidebar-w);
    background: var(--panel);
    border-left: 1px solid var(--line);
    z-index: 10;
    display: flex;
    flex-direction: column;
    font-family: var(--mono);
  }
  .term-bar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 18px;
    border-bottom: 1px solid var(--line);
    font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--gray);
  }
  .term-bar .dots { display: flex; gap: 6px; }
  .term-bar .dots i { width: 8px; height: 8px; border: 1px solid var(--gray); display: block; }
  .term-bar .dots i:first-child { background: var(--white); border-color: var(--white); }
  .term-bar button {
    background: none; border: 1px solid var(--dim); color: var(--gray);
    font: inherit; letter-spacing: inherit; padding: 3px 7px; cursor: pointer;
  }
  .term-bar button:hover { border-color: var(--white); color: var(--white); }
  .term-bar button[hidden] { display: none; }

  .search {
    position: relative;
    display: flex; align-items: center; gap: 10px;
    padding: 0 18px;
    height: 46px;
    border-bottom: 1px solid var(--line);
  }
  .search:focus-within { border-bottom-color: var(--white); }
  .search .prompt { font-weight: 700; color: var(--white); }
  .search input {
    flex: 1; min-width: 0;
    background: none; border: none; outline: none;
    color: var(--white);
    font-family: var(--mono); font-size: 12px; letter-spacing: .02em;
    caret-color: var(--white);
  }
  .search input::placeholder { color: var(--dim); }
  #q-count { font-size: 10px; color: var(--gray); letter-spacing: .1em; white-space: nowrap; }
  .search kbd {
    font-family: var(--mono); font-size: 10px; color: var(--dim);
    border: 1px solid var(--dim); padding: 0 5px; line-height: 16px;
  }
  .search:focus-within kbd, .search kbd[hidden] { display: none; }
  #q-clear {
    background: none; border: 1px solid var(--dim); color: var(--gray);
    font-family: var(--mono); font-size: 13px; line-height: 1; width: 20px; height: 20px; cursor: pointer;
  }
  #q-clear:hover { border-color: var(--white); color: var(--white); }
  #results {
    position: absolute; left: 0; right: 0; top: 100%;
    z-index: 30;
    max-height: min(60vh, 420px); overflow-y: auto;
    background: var(--panel);
    border-bottom: 1px solid var(--white);
    box-shadow: 0 24px 40px rgba(0,0,0,.85);
    font-size: 11.5px;
    scrollbar-width: thin; scrollbar-color: var(--dim) transparent;
  }
  #results .r-head {
    padding: 10px 18px 4px; font-size: 9.5px; color: var(--dim); letter-spacing: .14em; text-transform: uppercase;
  }
  #results .r {
    display: block; padding: 7px 18px; cursor: pointer; border-left: 3px solid transparent;
  }
  #results .r .r-top { display: flex; gap: 10px; }
  #results .r .r-code { color: var(--dim); flex: none; }
  #results .r .r-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; align-self: center; }
  #results .r .r-name { color: var(--white); font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #results .r .r-sub { color: var(--gray); font-size: 10.5px; padding-left: 64px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #results .r mark { background: var(--white); color: var(--bg); padding: 0 1px; }
  #results .r.on, #results .r:hover { background: #17181B; border-left-color: var(--white); }
  #results .r .r-off { margin-left: auto; flex: none; color: var(--dim); font-size: 9px; letter-spacing: .1em; text-transform: uppercase; }
  #results .r-empty { padding: 14px 18px; color: var(--gray); }
  #term {
    flex: 1;
    overflow-y: auto;
    padding: 18px 18px 28px;
    font-size: 11.5px;
    line-height: 1.62;
    color: var(--white);
    scrollbar-width: thin;
    scrollbar-color: var(--dim) transparent;
  }
  #term .ln { white-space: pre-wrap; word-break: break-word; min-height: 1.62em; }
  #term .muted { color: var(--dim); }
  #term .gray { color: var(--gray); }
  #term .big {
    font-family: var(--sans); font-weight: 900; font-size: 26px; line-height: 1;
    letter-spacing: -.03em; text-transform: uppercase; margin: 6px 0 8px;
  }
  #term .inv { background: var(--white); color: var(--bg); display: inline; padding: 0 4px; font-weight: 700; }
  #term .rule { color: var(--dim); overflow: hidden; white-space: nowrap; }
  #term .link-line { cursor: pointer; }
  #term .link-line:hover { background: #17181B; }
  #term a.src-line { display: block; color: var(--white); text-decoration: underline; text-decoration-style: dashed; text-underline-offset: 3px; text-decoration-color: var(--gray); }
  #term a.src-line.gray { color: var(--gray); }
  #term a.src-line:hover { background: #17181B; text-decoration-style: solid; text-decoration-color: var(--white); }
  #term .bold { font-weight: 700; }
  /* colored category dot: before the text (index) or after it (detail) */
  #term .dotl::before, #term .dote::after {
    content: ""; display: inline-block; width: .7em; height: .7em; border-radius: 50%;
    background: var(--dot); vertical-align: .02em;
  }
  #term .dotl::before { margin-right: calc(2ch - .7em); }
  #term .dote::after { margin-left: 1ch; }
  #term .ind { padding-left: 6ch; }
  #term .ind2 { padding-left: 2ch; }
  #term .amtl { display: table; background: var(--white); color: var(--bg); font-weight: 700; padding: 0 5px; margin: 3px 0 3px 6ch; }
  #term .amtl.flush { margin-left: 0; }
  .cursor {
    display: inline-block; width: 7px; height: 13px; background: var(--white);
    vertical-align: -2px; margin-left: 2px; animation: blink 1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  .term-foot {
    border-top: 1px solid var(--line);
    padding: 10px 18px;
    font-size: 9.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim);
    display: flex; justify-content: space-between;
  }

  /* ---------- TOUCH ---------- */
  header, #filter, #legend, .term-bar, .term-foot { touch-action: none; }
  aside, #term, #results, #filterPanel { touch-action: pan-y; overscroll-behavior: contain; }

  /* ---------- RESPONSIVE ---------- */
  @media (max-width: 760px) {
    :root { --sidebar-w: 0px; --panel-h: 42vh; }
    @supports (height: 100dvh) { :root { --panel-h: 42dvh; } }   /* follows the phone's address bar */
    #stage { inset: 0 0 var(--panel-h) 0; }
    aside { top: auto; left: 0; width: 100%; height: var(--panel-h); border-left: none; border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
    .search input { font-size: 16px; }   /* 16px+ stops iPhones from zooming the page when typing */
    .search kbd { display: none; }
    #filterBtn { width: 40px; height: 36px; }
    #addBtn { position: fixed; top: 44px; left: 132px; width: 36px; height: 30px; }   /* second row, next to Grupos/Libre: the title row has no spare room */
    #viewSw { position: fixed; top: 44px; left: 14px; height: 30px; }   /* under the title, so it never covers it */
    #viewSw button { padding: 0 9px; font-size: 9px; }
    header { top: 12px; left: 14px; gap: 8px; }
    header img { width: 22px; }
    header .kicker { font-size: 9px; }
    #legend { display: none; }
    #filter { top: 10px; right: 14px; }
    #filterPanel { width: min(290px, calc(100vw - 28px)); max-height: calc(100vh - var(--panel-h) - 60px); }
    #filterPanel .f-row { padding: 9px 14px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .link-flow, .cursor { animation: none; }
  }
</style>
</head>

      .sort((p, q) => ARC_ORDER.indexOf(p.id) - ARC_ORDER.indexOf(q.id));
    const a0 = -25 * Math.PI / 180, a1 = 55 * Math.PI / 180;
    arc.forEach((n, i) => {

    nodes.filter(n => n.ax === undefined).forEach((n, i) => {

  (function clusterLayout() {
    const nodeById = new Map(nodes.map(n => [n.id, n]));
    // entities in no cluster: each one gets its own "SIN GRUPO" cluster, so the map never draws it
    // inside the outline of a group it does not belong to (e.g. a director inside ACCIONISTAS)
    const listed = new Set(CLUSTERS.flatMap(c => [c.hub, ...c.members]).filter(Boolean));
    const loose = nodes.filter(n => n.id !== "ueno" && !listed.has(n.id));
    if (loose.length) console.warn("Entidades sin grupo (se muestran aparte como «SIN GRUPO»): " + loose.map(n => n.id).join(", "));
    loose.forEach(n => CLUSTERS.push({ id: "solo_" + n.id, title: "SIN GRUPO", members: [n.id] }));
    const clusterOf = new Map();
    // check: unknown ids, entities in two clusters, entities in no cluster (see the browser console)
    CLUSTERS.forEach(c => {
      [c.hub, ...c.members].filter(Boolean).forEach(id => {
        if (!nodeById.has(id)) console.warn("Grupo " + c.id + ": entidad desconocida «" + id + "»");
        else if (clusterOf.has(id) && clusterOf.get(id) !== c) console.warn("«" + id + "» está en dos grupos: " + clusterOf.get(id).id + " y " + c.id);
        else clusterOf.set(id, c);
      });
      c.members = c.members.filter(id => nodeById.has(id) && clusterOf.get(id) === c && id !== c.hub);
      if (c.hub && !nodeById.has(c.hub)) delete c.hub;
      c.root = c.hub || "ueno";
    });
    nodes.forEach(n => n.cl = clusterOf.get(n.id) || null);

    const nbrs = new Map(nodes.map(n => [n.id, []]));
    links.forEach(l => { nbrs.get(l.source).push(l.target); nbrs.get(l.target).push(l.source); });
    const wrap = a => Math.atan2(Math.sin(a), Math.cos(a));

    // 1) inside each cluster: who is on the first ring, who hangs further out behind someone
    CLUSTERS.forEach(c => {
      const inC = new Set(c.members);
      const depth = new Map(), parent = new Map();
      c.members.forEach(id => { if (nbrs.get(id).includes(c.root)) depth.set(id, 1); });
      const others = () => c.members.filter(id => !depth.has(id));
      let grew = true;
      while (grew) {
        grew = false;
        others().forEach(id => {
          const p = nbrs.get(id).find(o => inC.has(o) && depth.has(o));
          if (p) { depth.set(id, depth.get(p) + 1); parent.set(id, p); grew = true; }
        });
        if (!grew && others().length) { depth.set(others()[0], 1); grew = true; }
      }
      Object.assign(c, { inC, depth, parent, first: c.members.filter(id => depth.get(id) === 1) });
      const deep = c.members.length > c.first.length;
      const n = c.first.length;
      if (c.hub) {
        // ring size grows with the members: about 140 between neighbours; when one ring would get
        // too big, every other member goes on a second ring 90 further out
        const GAP = 140, MAXR = 200;
        const need = k => k < 2 ? 0 : GAP / (2 * Math.sin(Math.PI / k));
        c.stagger = need(n) > MAXR;
        c.R = Math.max(c.R || 0, 85, c.stagger ? need(Math.ceil(n / 2)) : need(n));
        c.size = c.R + (c.stagger ? 90 : 0) + (deep ? 105 : 0) + 70;
      } else {
        const cols = Math.min(c.cols || n, n) || 1, rows = Math.ceil(n / cols);
        c.blockW = cols * 150; c.blockH = rows * 76;   // final orientation is decided once placed
        c.size = Math.hypot(Math.max(cols, rows) * 150, Math.max(cols, rows) * 76 + 40) / 2 + 20 + (deep ? 60 : 0);
      }
    });

    // 2) clusters without x / y: the free spot closest to what they are linked to
    const core = { x: 0, y: 0, size: 130, fixed: true };
    const placed = [core, ...CLUSTERS.filter(c => c.x !== undefined)];
    const fits = (c, x, y) => placed.every(q => Math.hypot(q.x - x, q.y - y) >= q.size + c.size + 16);
    CLUSTERS.filter(c => c.x === undefined).forEach(c => {
      let sx = 0, sy = 0, k = 0;
      [c.hub, ...c.members].filter(Boolean).forEach(id => nbrs.get(id).forEach(o => {
        const q = o === "ueno" ? core : clusterOf.get(o);
        if (q && q !== c && q.x !== undefined) { sx += q.x; sy += q.y; k++; }
      }));
      const tx = k ? sx / k : 0, ty = k ? sy / k : 0;
      let best = null;
      for (let r = 0; r <= 3000 && !best; r += 60) {
        const steps = r ? Math.max(12, Math.round(r / 40)) : 1;
        let bd = Infinity;
        for (let i = 0; i < steps; i++) {
          const a = i * 2 * Math.PI / steps, x = tx + Math.cos(a) * r, y = ty + Math.sin(a) * r;
          if (!fits(c, x, y)) continue;
          const d = Math.hypot(x, y);   // among equal choices, stay closer to the bank
          if (d < bd) { bd = d; best = { x, y }; }
        }
      }
      c.x = best ? best.x : tx; c.y = best ? best.y : ty;
      placed.push(c);
    });

    // 3) keep clusters from overlapping: overlapping circles are pushed apart (the bank stays put)
    const all = [core, ...CLUSTERS];
    for (let it = 0; it < 300; it++) {
      let moved = false;
      for (let i = 0; i < all.length; i++) for (let j = i + 1; j < all.length; j++) {
        const p = all[i], q = all[j];
        let dx = q.x - p.x, dy = q.y - p.y, d = Math.hypot(dx, dy);
        const need = p.size + q.size + 16;
        if (d >= need) continue;
        if (d < 1) { dx = 1; dy = 0; d = 1; }
        const push = (need - d) / 2, ux = dx / d, uy = dy / d;
        const wp = p.fixed ? 0 : q.fixed ? 2 : 1, wq = q.fixed ? 0 : p.fixed ? 2 : 1;
        p.x -= ux * push * wp; p.y -= uy * push * wp;
        q.x += ux * push * wq; q.y += uy * push * wq;
        moved = true;
      }
      if (!moved) break;
    }

    // rough position of any entity: its cluster center (ueno for the bank)
    const roughPos = id => {
      if (id === "ueno") return core;
      const c = clusterOf.get(id);
      return c ? c : null;
    };
    const ueno = nodeById.get("ueno"); ueno.gx = 0; ueno.gy = 0;

    // 4) place the members
    CLUSTERS.forEach(c => {
      const { inC, parent, first } = c;
      const outward = Math.atan2(c.y, c.x);   // away from ueno
      // each first-ring member faces the things it (and whoever hangs behind it) is linked to outside the cluster
      const pref = id => {
        const fam = [id, ...c.members.filter(m => { let p = parent.get(m); while (p) { if (p === id) return true; p = parent.get(p); } return false; })];
        let sx = 0, sy = 0;
        fam.forEach(f => nbrs.get(f).forEach(o => {
          if (o === c.root || inC.has(o)) return;
          const p = roughPos(o); if (!p) return;
          const dx = p.x - c.x, dy = p.y - c.y, d = Math.hypot(dx, dy) || 1;
          sx += dx / d; sy += dy / d;
        }));
        return sx || sy ? Math.atan2(sy, sx) : null;
      };
      const pos = new Map();
      if (c.hub) {
        const n = first.length;
        const prefs = first.map(id => ({ id, a: pref(id) }));
        prefs.forEach(p => { if (p.a === null) p.a = outward; });
        prefs.sort((p, q) => wrap(p.a - outward) - wrap(q.a - outward));
        // best rotation of the evenly spaced slots
        let sx = 0, sy = 0;
        prefs.forEach((p, i) => { const d = p.a - i * 2 * Math.PI / n; sx += Math.cos(d); sy += Math.sin(d); });
        const rot = n > 1 ? Math.atan2(sy, sx) : prefs[0] ? prefs[0].a : 0;
        prefs.forEach((p, i) => {
          const a = rot + i * 2 * Math.PI / n, r = c.R + (c.stagger && i % 2 ? 90 : 0);
          pos.set(p.id, { x: c.x + Math.cos(a) * r, y: c.y + Math.sin(a) * r, a });
        });
        const hub = nodeById.get(c.hub); hub.gx = c.x; hub.gy = c.y;
      } else {
        // compact grid at (x, y): columns 150 apart, rows 76 apart. Every other row (or column, for a
        // block beside the bank) is shifted half a step, so the lines of the back nodes pass between the front ones.
        const prefs = first.map(id => ({ id, a: pref(id) }));
        const side = Math.abs(c.x) > Math.abs(c.y);           // block left/right of the bank (else above/below)
        const toward = Math.atan2(-c.y, -c.x);
        // order: across the block, members pulled one way go to that side
        prefs.forEach(p => { const a = p.a === null ? toward : p.a; p.k = side ? Math.sin(a) : Math.cos(a); });
        prefs.sort((p, q) => p.k - q.k);
        const n = prefs.length, cols = Math.min(c.cols || n, n), rows = Math.ceil(n / cols);
        const CW = 150, RH = 76;
        // a block beside the bank is filled column by column (front column first), else row by row (front row first)
        prefs.forEach((p, i) => {
          let col, row, x, y;
          if (side) {
            const per = rows;                                       // nodes per column
            col = Math.floor(i / per); row = i - col * per;
            const inCol = Math.min(per, n - col * per);
            const front = c.x < 0 ? -1 : 1;                         // which way is away from the bank
            x = c.x + (col - (Math.ceil(n / per) - 1) / 2) * CW * front;
            y = c.y + (row - (inCol - 1) / 2 + (col % 2 ? .5 : 0)) * RH;
          } else {
            row = Math.floor(i / cols); col = i - row * cols;
            const inRow = Math.min(cols, n - row * cols);
            const front = c.y < 0 ? -1 : 1;
            y = c.y + (row - (rows - 1) / 2) * RH * front;
            x = c.x + (col - (inRow - 1) / 2 + (row % 2 && inRow === cols ? .5 : 0)) * CW;
          }
          pos.set(p.id, { x, y, a: Math.atan2(y, x) });
        });
      }
      // further rings: one step out, behind the member they hang from
      const deeper = c.members.filter(id => c.depth.get(id) > 1).sort((p, q) => c.depth.get(p) - c.depth.get(q));
      const kids = new Map();
      deeper.forEach(id => { const p = parent.get(id); kids.set(p, (kids.get(p) || []).concat(id)); });
      deeper.forEach(id => {
        const p = pos.get(parent.get(id)); const sib = kids.get(parent.get(id)); const k = sib.indexOf(id);
        const a = p.a + (k - (sib.length - 1) / 2) * 0.55;
        const step = c.hub ? 105 : 120;
        pos.set(id, { x: p.x + Math.cos(a) * step, y: p.y + Math.sin(a) * step, a });
      });
      pos.forEach((p, id) => { const n = nodeById.get(id); n.gx = p.x; n.gy = p.y; });
    });
    // entities in no cluster: next to what they are linked to
    nodes.filter(n => n.gx === undefined).forEach((n, i) => {
      const o = nbrs.get(n.id).map(id => nodeById.get(id)).find(m => m.gx !== undefined);
      const base = o || ueno, a = i * 0.9 + 0.4;
      n.gx = base.gx + Math.cos(a) * 130; n.gy = base.gy + Math.sin(a) * 130;
    });
  })();

  const byId = new Map(nodes.map(n => [n.id, n]));
  const radius = n => n.r || GROUPS[n.group].r;   // n.r = per-node size override (key figures)
  const display = n => n.short || n.label;
  const hasOuter = n => n.group === "hub" || n.group === "state";
  const labelW = n => display(n).length * (n.group === "hub" ? 10 : 6.4);

  /* ================================================================
     SVG STAGE
     ================================================================ */
  const stage = document.getElementById("stage");
  let W = stage.clientWidth, H = stage.clientHeight;

  const svg = d3.select(stage).append("svg").attr("role", "img")
    .attr("aria-label", "Red de conexiones del caso ueno");

  const defs = svg.append("defs");
  defs.append("marker")
    .attr("id", "arrow").attr("viewBox", "0 -5 10 10")
    .attr("refX", 10).attr("refY", 0)
    .attr("markerWidth", 6).attr("markerHeight", 6)
    .attr("markerUnits", "userSpaceOnUse")
    .attr("orient", "auto")
    .append("path").attr("d", "M0,-5L10,0L0,5Z").attr("fill", "#FFFFFF");
  defs.append("marker")
    .attr("id", "arrow-dim").attr("viewBox", "0 -5 10 10")
    .attr("refX", 10).attr("refY", 0)
    .attr("markerWidth", 5).attr("markerHeight", 5)
    .attr("markerUnits", "userSpaceOnUse")
    .attr("orient", "auto")
    .append("path").attr("d", "M0,-5L10,0L0,5Z").attr("fill", "#8A8F98");

  // Background: architectural grid (fixed frame, does not zoom)
  const bg = svg.append("g").attr("class", "grid");
  function drawGrid() {
    bg.selectAll("*").remove();
    const step = 80;
    for (let x = step; x < W; x += step) bg.append("line").attr("x1", x).attr("x2", x).attr("y1", 0).attr("y2", H);
    for (let y = step; y < H; y += step) bg.append("line").attr("y1", y).attr("y2", y).attr("x1", 0).attr("x2", W);
    bg.append("line").attr("class", "crosshair").attr("x1", W / 2).attr("x2", W / 2).attr("y1", 0).attr("y2", H);
    bg.append("line").attr("class", "crosshair").attr("y1", H / 2).attr("y2", H / 2).attr("x1", 0).attr("x2", W);
  }
  drawGrid();

  const world = svg.append("g");
  // Phones/tablets: the map can't be zoomed out past "whole map on screen" nor dragged off into empty canvas
  // (fitView() sets both limits to the fitted view). Desktop keeps free zoom-out and free panning.
  const limitToFit = window.matchMedia("(hover: none) and (pointer: coarse)").matches;
  let onZoom = () => {};
  const zoom = d3.zoom().scaleExtent([0.2, 3]).on("zoom", e => { world.attr("transform", e.transform); onZoom(e.transform.k); });
  svg.call(zoom).on("dblclick.zoom", null);

  const haloG = world.append("g");
  const linkG = world.append("g");
  const nodeG = world.append("g");
  const haloSel = haloG.selectAll("g.halo").data(CLUSTERS).join("g").attr("class", "halo");
  haloSel.append("path");
  haloSel.append("text").attr("class", "t").text(c => c.title)
    .append("title").text("Clic para acercar este grupo");
  // cluster titles stay readable on screen when the whole map is zoomed out
  onZoom = k => haloSel.select("text").style("font-size", ((W < 760 ? 7 : 11) / Math.min(1, k)).toFixed(1) + "px");

  const linkSel = linkG.selectAll("g.l").data(links).join("g").attr("class", "l");
  const linkPath = linkSel.append("line").attr("class", "link").attr("marker-end", "url(#arrow)");
  linkSel.append("line").attr("class", "link-flow");
  const linkHit = linkSel.append("line").attr("class", "link-hit");

  // Thinner lines for busy nodes: the more connections an endpoint has, the thinner the line
  // (about 2.2px for quiet nodes down to 0.9px for the bank's many spokes).
  const degree = new Map(nodes.map(n => [n.id, 0]));
  const nid = e => (typeof e === "string" ? e : e.id);     // links hold ids until the simulation links them up
  links.forEach(l => { degree.set(nid(l.source), degree.get(nid(l.source)) + 1); degree.set(nid(l.target), degree.get(nid(l.target)) + 1); });
  const lineW = l => {
    const d = Math.max(degree.get(nid(l.source)), degree.get(nid(l.target)));
    const t = Math.min(1, Math.max(0, (d - 3) / 17));     // 3 or fewer → 0, 20 or more → 1
    return 2.2 - 1.3 * t;
  };
  linkSel.style("--w", l => lineW(l).toFixed(2)).style("--fw", l => (lineW(l) * 0.66).toFixed(2));

  const nodeSel = nodeG.selectAll("g.node").data(nodes).join("g")
    .attr("class", d => "node " + d.group + (d.pending ? " pending" : ""))
    .attr("tabindex", 0)
    .attr("role", "button")
    .attr("aria-label", d => d.label + " — " + d.role + " (" + CATS[d.cat].name + ")");

  nodeSel.filter(hasOuter).append("circle").attr("class", "ring-outer").attr("r", d => radius(d) + 7);
  nodeSel.append("circle").attr("class", "ring").attr("r", radius);
  nodeSel.each(function (d) {
    const g = d3.select(this);
    if (d.group === "regulator") {
      g.append("rect").attr("class", "core").attr("x", -4.5).attr("y", -4.5).attr("width", 9).attr("height", 9);
    } else {
      g.append("circle").attr("class", "core")
        .attr("r", d.group === "hub" ? 8 : d.group === "political" || d.group === "holding" ? 5.5 : 4.5);
    }
    g.select(".core").style("fill", CATS[d.cat].color);   // center dot = category color
  });
  nodeSel.append("text").attr("class", "label")
    .attr("dy", d => radius(d) + (hasOuter(d) ? 24 : 16))
    .text(display);
  nodeSel.append("text").attr("class", "code")
    .attr("dy", d => -radius(d) - (hasOuter(d) ? 13 : 7))
    .text(d => d.code);

  /* ================================================================
     LAYOUT SETTLING — two views
     "groups" (default): every node is held at its place in its cluster (see CLUSTERS);
       a box-shaped collision only nudges nodes whose names would overlap.
     "free" (Libre): the original force layout, each node pulled toward its district (ax / ay).
     Both layouts are computed once at load; switching view animates between them.
     The whole world is then zoomed to fit the screen.
     ================================================================ */
  nodes.forEach((n, i) => { n.phase = i * 1.7; n.freq = 0.00035 + (i % 5) * 0.00007; });

  function driftForce() {
    let ns;
    function force() {
      const t = performance.now();
      for (const n of ns) {
        n.vx += Math.cos(t * n.freq + n.phase) * 0.006;
        n.vy += Math.sin(t * n.freq * 1.3 + n.phase) * 0.006;
      }
    }
    force.initialize = _ => ns = _;
    return force;
  }

  // Collision on the box each node takes on screen (circle + its name underneath)
  const boxOf = n => {
    const r = radius(n) + (hasOuter(n) ? 8 : 0);
    return { hw: Math.max(r, labelW(n) / 2) + 6, top: r + 12, bottom: r + (hasOuter(n) ? 30 : 22) };
  };
  function boxCollide() {
    let ns;
    function force() {
      for (let i = 0; i < ns.length; i++) {
        const a = ns[i], ba = boxOf(a);
        for (let j = i + 1; j < ns.length; j++) {
          const b = ns[j], bb = boxOf(b);
          const dx = (b.x + b.vx) - (a.x + a.vx), dy = (b.y + b.vy) - (a.y + a.vy);
          const ox = ba.hw + bb.hw - Math.abs(dx);
          const oy = (dy > 0 ? ba.bottom + bb.top : ba.top + bb.bottom) - Math.abs(dy);
          if (ox <= 0 || oy <= 0) continue;
          const wa = a.id === "ueno" ? 0 : 0.5, wb = b.id === "ueno" ? 0 : 0.5;
          const s = 1 / ((wa + wb) || 1);
          if (ox < oy * 1.6) {   // names sit side by side: push sideways
            const m = ox * 0.5 * (dx < 0 ? -1 : 1);
            a.vx -= m * wa * s; b.vx += m * wb * s;
          } else {
            const m = oy * 0.5 * (dy < 0 ? -1 : 1);
            a.vy -= m * wa * s; b.vy += m * wb * s;
          }
        }
      }
    }
    force.initialize = _ => ns = _;
    return force;
  }

  const sim = d3.forceSimulation(nodes).stop();
  const VIEWS = {
    groups: {
      start: n => [n.gx, n.gy],
      forces: () => sim
        .force("link", d3.forceLink(links).id(d => d.id).strength(0))   // only turns ids into nodes
        .force("charge", null)
        .force("collide", boxCollide())
        .force("x", d3.forceX(d => d.gx).strength(d => d.id === "ueno" ? 1 : 0.12))
        .force("y", d3.forceY(d => d.gy).strength(d => d.id === "ueno" ? 1 : 0.12))
        .velocityDecay(0.5)
    },
    free: {
      start: n => [n.ax + (Math.random() - .5) * 40, n.ay + (Math.random() - .5) * 40],
      forces: () => sim
        .force("link", d3.forceLink(links).id(d => d.id).distance(150).strength(0.06))
        .force("charge", d3.forceManyBody().strength(d => d.group === "hub" ? -900 : -260).distanceMax(380))
        .force("collide", d3.forceCollide().radius(d => Math.max(radius(d) + (hasOuter(d) ? 30 : 22), labelW(d) / 2 + 6)).iterations(2))
        .force("x", d3.forceX(d => d.ax).strength(d => d.group === "hub" ? 0.6 : 0.2))
        .force("y", d3.forceY(d => d.ay).strength(d => d.group === "hub" ? 0.6 : 0.2))
        .velocityDecay(0.55)
    }
  };
  // Settle both layouts before the first paint so nothing "explodes" on load, and keep where each one ends
  const settled = {};
  ["free", "groups"].forEach(v => {
    VIEWS[v].forces();
    nodes.forEach(n => { [n.x, n.y] = VIEWS[v].start(n); n.vx = n.vy = 0; });
    sim.alpha(1);
    for (let i = 0; i < 300; i++) sim.tick();
    settled[v] = new Map(nodes.map(n => [n.id, [n.x, n.y]]));
  });
  let view = "groups";
  try { if (localStorage.getItem("ueno-vista") === "free") view = "free"; } catch (e) { /* storage blocked: default view */ }
  VIEWS[view].forces();
  nodes.forEach(n => { [n.x, n.y] = settled[view].get(n.id); n.vx = n.vy = 0; });
  document.body.classList.toggle("view-free", view === "free");
  sim.force("drift", driftForce()).alphaMin(0).alpha(0.02).alphaTarget(0.012).on("tick", ticked).restart();

  function edgePoints(l) {
    const dx = l.target.x - l.source.x, dy = l.target.y - l.source.y;
    const dist = Math.hypot(dx, dy) || 1;
    const ux = dx / dist, uy = dy / dist;
    const rs = radius(l.source) + (hasOuter(l.source) ? 9 : 3);
    const rt = radius(l.target) + (hasOuter(l.target) ? 10 : 4);
    return { x1: l.source.x + ux * rs, y1: l.source.y + uy * rs, x2: l.target.x - ux * rt, y2: l.target.y - uy * rt };
  }

  function ticked() {
    linkSel.each(function (l) {
      const p = edgePoints(l);
      d3.select(this).selectAll("line").attr("x1", p.x1).attr("y1", p.y1).attr("x2", p.x2).attr("y2", p.y2);
    });
    nodeSel.attr("transform", d => `translate(${d.x},${d.y})`);
    if (view === "groups") drawHalos();
  }

  // Outline around each cluster: a circle around a cluster with its own center,
  // a rounded outline around the blocks that sit beside the bank.
  const haloLine = d3.line().curve(d3.curveCatmullRomClosed.alpha(0.5));
  function drawHalos() {
    haloSel.each(function (c) {
      const g = d3.select(this);
      const ms = nodes.filter(n => n.cl === c && !n.hidden);
      g.classed("hidden", ms.length === 0);
      if (!ms.length) return;
      const ext = n => Math.max(radius(n) + (hasOuter(n) ? 16 : 12), labelW(n) / 2 + 4);
      let d, tx, ty;
      if (c.hub) {
        const h = byId.get(c.hub), cx = h.hidden ? d3.mean(ms, n => n.x) : h.x, cy = h.hidden ? d3.mean(ms, n => n.y) : h.y;
        const r = d3.max(ms, n => Math.hypot(n.x - cx, n.y - cy) + ext(n) * (n === h ? 1 : .85)) + 10;
        d = `M${cx - r},${cy}a${r},${r} 0 1,0 ${2 * r},0a${r},${r} 0 1,0 ${-2 * r},0`;
        tx = cx; ty = cy - r - 8;
      } else {
        const pts = [];
        ms.forEach(n => {
          const r = radius(n) + (hasOuter(n) ? 18 : 14), hw = labelW(n) / 2 + 8, lb = n.y + radius(n) + (hasOuter(n) ? 32 : 24);
          for (let k = 0; k < 12; k++) { const a = k * Math.PI / 6; pts.push([n.x + Math.cos(a) * r, n.y + Math.sin(a) * r]); }
          pts.push([n.x - hw, lb], [n.x + hw, lb], [n.x - hw, n.y], [n.x + hw, n.y]);
        });
        const hull = d3.polygonHull(pts);
        d = haloLine(hull);
        tx = (d3.min(hull, p => p[0]) + d3.max(hull, p => p[0])) / 2; ty = d3.min(hull, p => p[1]) - 8;
      }
      g.select("path").attr("d", d);
      g.select("text").attr("x", tx).attr("y", ty);
    });
  }
  ticked();

  // Dragging
  nodeSel.call(d3.drag()
    .on("start", (e, d) => { tip.classList.remove("show"); if (!e.active) sim.alphaTarget(0.2).restart(); d.fx = d.x; d.fy = d.y; })
    .on("drag",  (e, d) => { d.fx = e.x; d.fy = e.y; })
    .on("end",   (e, d) => { if (!e.active) sim.alphaTarget(0.012); d.fx = null; d.fy = null; }));

  /* ---------- map filter (dropdown, top right) ----------
     Default view = TODO (everything). Ticking an option narrows the map to it; ticking several
     shows all of them together (e.g. PEP + Imputados). "Solo flujo de dinero" then keeps only
     the money route. Money lines = public funds into the bank + bank/satellite → satellite. */
  let flowOn = false;
  const picked = new Set();   // empty = TODO
  // Imputados = charged (not convicted): said in the person's role, or in their own connection
  const PEOPLE = new Set(["political", "family", "regulator", "executive"]);
  nodes.forEach(n => {
    n.imputado = /imputad/i.test(n.role) ||
      (PEOPLE.has(n.group) && links.some(l => l.source === n && /imputad/i.test(l.desc)));
  });
  const FILTERS = { imputados: n => n.imputado };
  CAT_ORDER.forEach(k => FILTERS["cat:" + k] = n => n.cat === k);
  GROUP_ORDER.forEach(g => FILTERS["group:" + g] = n => n.group === g);
  // Money lines = public funds into the bank + money between the bank and the satellite companies (both ways)
  const bankOrSat = n => n.id === "ueno" || n.group === "satellite";
  const isMoney = l => l.source.group === "state" ||
    (l.target.group === "satellite" && bankOrSat(l.source)) ||
    (l.source.group === "satellite" && l.target.id === "ueno");
  const moneyLinks = new Set(links.filter(isMoney));
  // money lines are bright and animated; the other ties (family, ownership, posts) are thin dashed gray lines
  linkSel.classed("money", isMoney);
  linkPath.attr("marker-end", l => isMoney(l) ? "url(#arrow)" : "url(#arrow-dim)");
  const moneyNodes = new Set();
  moneyLinks.forEach(l => { moneyNodes.add(l.source.id); moneyNodes.add(l.target.id); });
  const isHidden = n => (picked.size > 0 && ![...picked].some(k => FILTERS[k](n))) || (flowOn && !moneyNodes.has(n.id));
  const linkHidden = l => isHidden(l.source) || isHidden(l.target) || (flowOn && !moneyLinks.has(l));
  const filterActive = () => flowOn || picked.size > 0;
  const keyOn = k => k === "flow" ? flowOn : picked.has(k);

  /* ---------- fit the whole map to the available screen ---------- */
  // world box of a set of nodes (circle + name), plus the outline and title of their clusters
  function boxOfNodes(list) {
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    list.forEach(n => {
      const half = Math.max(radius(n) + 8, labelW(n) / 2);
      x0 = Math.min(x0, n.x - half); x1 = Math.max(x1, n.x + half);
      y0 = Math.min(y0, n.y - radius(n) - 24); y1 = Math.max(y1, n.y + radius(n) + 34);
    });
    const cls = new Set(view === "groups" ? list.map(n => n.cl).filter(Boolean) : []);
    haloSel.each(function (c) {
      if (!cls.has(c)) return;
      const b = this.querySelector("path").getBBox(), t = this.querySelector("text").getBBox();
      x0 = Math.min(x0, b.x, t.x); x1 = Math.max(x1, b.x + b.width, t.x + t.width);
      y0 = Math.min(y0, b.y, t.y); y1 = Math.max(y1, b.y + b.height);
    });
    return { x0, y0, x1, y1 };
  }

  function fitView(animate) {
    const small = W < 760;
    const padX = small ? 16 : 48, padTop = small ? 86 : 70, padBottom = small ? 16 : 64;   // desktop: room for the one-row legend
    const shown = nodes.filter(n => !isHidden(n));
    const availW = W - padX * 2, availH = H - padTop - padBottom;
    // twice: the cluster titles grow when the map is zoomed out, so measure again at the new zoom
    let b = boxOfNodes(shown), k = 1;
    if (b.x0 === Infinity) return;   // the filter hides everything: keep the current view
    for (let pass = 0; pass < 2; pass++) {
      k = Math.min(1.1, availW / (b.x1 - b.x0), availH / (b.y1 - b.y0));
      onZoom(k); b = boxOfNodes(shown);
    }
    k = Math.min(1.1, availW / (b.x1 - b.x0), availH / (b.y1 - b.y0));
    onZoom(d3.zoomTransform(svg.node()).k);
    const { x0, y0, x1, y1 } = b;
    const tx = padX + availW / 2 - k * (x0 + x1) / 2;
    const ty = padTop + availH / 2 - k * (y0 + y1) / 2;
    const tr = d3.zoomIdentity.translate(tx, ty).scale(k);
    if (limitToFit) {
      zoom.scaleExtent([k, Math.max(3, k * 6)])
        .translateExtent([[-tx / k, -ty / k], [(W - tx) / k, (H - ty) / k]]);
    } else {
      zoom.scaleExtent([0.2, 3])
        .translateExtent([[-Infinity, -Infinity], [Infinity, Infinity]]);
    }
    (animate ? svg.transition().duration(800) : svg).call(zoom.transform, tr);
  }

  // Click on a cluster title: zoom in so the whole cluster fills the screen
  function zoomToCluster(c) {
    const { x0, y0, x1, y1 } = boxOfNodes(nodes.filter(n => n.cl === c && !isHidden(n)));
    if (x0 === Infinity) return;
    const pad = W < 760 ? 16 : 48, padTop = W < 760 ? 86 : 70;
    const availW = W - pad * 2, availH = H - padTop - pad;
    const k = Math.min(1.8, availW / (x1 - x0), availH / (y1 - y0));
    const tr = d3.zoomIdentity.translate(pad + availW / 2 - k * (x0 + x1) / 2, padTop + availH / 2 - k * (y0 + y1) / 2).scale(k);
    svg.transition().duration(800).call(zoom.transform, tr);
  }
  haloSel.select("text.t")
    .on("pointerdown", e => e.stopPropagation())   // a click on the title is not the start of a pan
    .on("click", (e, c) => { e.stopPropagation(); zoomToCluster(c); });

  /* ---------- view switch: Grupos | Libre ----------
     Moves every node from where it is to where it sits in the other view (0.8 s),
     then lets the gentle drift continue and fits the map to the screen. */
  const viewBtns = document.querySelectorAll("#viewSw button");
  const syncViewBtns = () => viewBtns.forEach(b => b.setAttribute("aria-pressed", String(b.dataset.view === view)));
  syncViewBtns();
  let viewTimer = null;
  function switchView(v) {
    if (v === view || !VIEWS[v]) return;
    view = v;
    try { localStorage.setItem("ueno-vista", v); } catch (e) { /* storage blocked: fine */ }
    syncViewBtns();
    document.body.classList.toggle("view-free", v === "free");
    sim.stop();
    if (viewTimer) viewTimer.stop();
    VIEWS[v].forces();
    const from = new Map(nodes.map(n => [n.id, [n.x, n.y]])), to = settled[v];
    const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const done = () => {
      nodes.forEach(n => { n.vx = n.vy = 0; });
      ticked();
      sim.alpha(0.02).restart();
      fitView(true);
    };
    if (reduce) { nodes.forEach(n => { [n.x, n.y] = to.get(n.id); }); done(); return; }
    viewTimer = d3.timer(t => {
      const k = d3.easeCubicInOut(Math.min(1, t / 800));
      nodes.forEach(n => {
        const [x0, y0] = from.get(n.id), [x1, y1] = to.get(n.id);
        n.x = x0 + (x1 - x0) * k; n.y = y0 + (y1 - y0) * k;
      });
      ticked();
      if (k >= 1) { viewTimer.stop(); viewTimer = null; done(); }
    });
  }
  viewBtns.forEach(b => b.addEventListener("click", () => switchView(b.dataset.view)));

  fitView(false);

  let selected = null;

  function neighborsOf(id) {
    const set = new Set([id]);
    links.forEach(l => {
      if (l.source.id === id) set.add(l.target.id);
      if (l.target.id === id) set.add(l.source.id);
    });
    return set;
  }

  function highlight(focus) {
    linkSel.classed("lit", false);
    if (!focus) {
      nodeSel.classed("dimmed", false).classed("active", false);
      linkSel.classed("dimmed", false);
      return;
    }
    if (focus.type === "search") {
      nodeSel.classed("dimmed", d => !focus.nodes.has(d.id)).classed("active", false);
      linkSel.classed("dimmed", l => !focus.links.has(l));
      return;
    }
    if (focus.type === "node") {
      const nb = neighborsOf(focus.id);
      nodeSel.classed("dimmed", d => !nb.has(d.id)).classed("active", d => d.id === focus.id);
      linkSel.classed("dimmed", l => l.source.id !== focus.id && l.target.id !== focus.id);
      linkSel.classed("lit", l => l.source.id === focus.id || l.target.id === focus.id);
    } else {
      const L = focus.link;
      nodeSel.classed("dimmed", d => d !== L.source && d !== L.target).classed("active", false);
      linkSel.classed("dimmed", l => l !== L).classed("lit", l => l === L);

  const term = document.getElementById("term");

  let typingToken = 0;

  const RULE = "─".repeat(60);
  const pad = (s, n) => (s + " ".repeat(n)).slice(0, n);
  const two = v => String(v).padStart(2, "0");
  const ts = () => {
    const d = new Date();
    return [d.getHours(), d.getMinutes(), d.getSeconds()].map(two).join(":");
  };
  const hex = (s) => {
    let h = 0x811c9dc5;
    for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 0x01000193); }
    return ("0000000" + (h >>> 0).toString(16)).slice(-8).toUpperCase();
  };
  const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  // Each line: { t: text, c: class, instant: bool, onClick, onEnter, onLeave }
  function type(lines) {
    const token = ++typingToken;
    term.innerHTML = "";
    term.scrollTop = 0;
    const total = lines.reduce((s, L) => s + (L.instant ? 0 : (L.t || "").length), 0);
    const speed = Math.max(3, Math.ceil(total / 200));   // long dumps finish in ~3-4 s
    const cursor = document.createElement("span");
    cursor.className = "cursor";
    let li = 0, ci = 0, el = null;

    function newLine() {
      const L = lines[li];
      el = document.createElement(L.href ? "a" : "div");
      el.className = "ln " + (L.c || "");
      if (L.dot) { el.classList.add(L.dotEnd ? "dote" : "dotl"); el.style.setProperty("--dot", L.dot); }
      if (L.href) {
        el.href = L.href; el.target = "_blank"; el.rel = "noopener noreferrer";
        el.classList.add("src-line");
        el.title = L.href;
      }
      if (L.onClick) {
        el.classList.add("link-line");
        el.addEventListener("click", L.onClick);
        if (L.onEnter) el.addEventListener("mouseenter", L.onEnter);
        if (L.onLeave) el.addEventListener("mouseleave", L.onLeave);
      }
      term.appendChild(el);
    }

    function step() {
      if (token !== typingToken) return;
      let budget = speed;
      while (budget > 0 && li < lines.length) {
        if (!el) newLine();
        const txt = lines[li].t || "";
        if (lines[li].instant || txt.length === 0) {
          el.textContent = txt; ci = txt.length;
        } else {
          const take = Math.min(budget, txt.length - ci);
          ci += take; budget -= take;
          el.textContent = txt.slice(0, ci);
        }
        el.appendChild(cursor);
        if (ci >= txt.length) { li++; ci = 0; el = null; budget -= 1; }
      }
      if (li < lines.length) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  /* ---------- filter dropdown ---------- */

  function filterRow(key, label, count, color, note) {
    return '<label class="f-row"><input type="checkbox" data-key="' + key + '">' +
      (color ? '<i class="f-dot" style="background:' + color + '"></i>' : "") +
      '<span class="f-name">' + esc(label) + (note ? "<small>" + esc(note) + "</small>" : "") + "</span>" +
      (count != null ? '<span class="f-n">' + two(count) + "</span>" : "") +
      "</label>";
  }
  (function buildFilter() {
    let h = '<div class="f-head">Vista</div>';
    h += filterRow("todo", "Todo", nodes.length);
    h += '<div class="f-head">Causa judicial</div>';
    h += filterRow("imputados", "Imputados", nodes.filter(n => n.imputado).length, null, "Imputado no significa condenado");
    h += '<div class="f-head">Categoría</div>';
    CAT_ORDER.forEach(k => {
      const c = nodes.filter(n => n.cat === k).length;
      if (c) h += filterRow("cat:" + k, CATS[k].legend, c, CATS[k].color);
    });
    h += '<div class="f-head">Tipo de entidad</div>';
    GROUP_ORDER.forEach(g => {
      const c = nodes.filter(n => n.group === g).length;
      if (c) h += filterRow("group:" + g, GROUPS[g].name, c);
    });
    h += '<div class="f-head">Vínculos</div>';
    h += filterRow("flow", "Solo flujo de dinero", null, null, "Fondos públicos → ueno → empresas satélite");
    h += '<div class="f-foot"><span id="f-count"></span></div>';

  function applyFilter(refit = true) {
    nodes.forEach(n => n.hidden = isHidden(n));
    drawHalos();
    nodeSel.classed("hidden", isHidden);
    linkSel.classed("hidden", linkHidden);
    document.getElementById("tip").classList.remove("show");
    const shown = nodes.filter(n => !isHidden(n)).length;
    const on = filterActive();
    filterBtn.title = on ? "Filtro activo: " + shown + " de " + nodes.length + " entidades visibles" : "Filtro: elegí qué entidades mostrar en el mapa";
    filterBtn.classList.toggle("on", on);
    fCount.textContent = shown + " de " + nodes.length + " visibles";
    filterPanel.querySelectorAll("input[data-key]").forEach(inp => {
      const k = inp.dataset.key;
      inp.checked = k === "todo" ? !on : k === "flow" ? flowOn : picked.has(k);
    });
    // bottom legend: items whose filter is switched on look pressed
    document.querySelectorAll("#legend [data-fk]").forEach(el => {
      const pressed = el.dataset.fk.split(" ").every(keyOn);
      el.classList.toggle("on", pressed);

    });

  const tip = document.getElementById("tip");

  function moveTip(e) {
    // sit beside the cursor (not under it, so the node's own name stays readable); flip left near the sidebar
    const w = tip.offsetWidth || 280, h = tip.offsetHeight || 120;
    const room = window.innerWidth - parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--sidebar-w") || 0);
    let x = e.clientX + 26;
    if (x + w > room - 8) x = e.clientX - w - 26;
    tip.style.left = Math.max(8, x) + "px";
    tip.style.top = Math.max(8, Math.min(e.clientY - 24, window.innerHeight - h - 10)) + "px";
  }

  const legend = d3.select("#legend");

  function toggleKeys(keys) {

  }
  // sel: the legend element; o = { keys, head, title, dot, count, list, nodeIds, links }
  function bindPick(sel, o) {
    const light = () => { if (!selected) highlight({ type: "search", nodes: new Set(o.nodeIds), links: o.links || new Set() }); };
    sel.attr("data-fk", o.keys.join(" ")).attr("tabindex", 0).attr("role", "button").attr("aria-pressed", "false")
      .attr("aria-label", "Filtrar el mapa: " + o.title + " (" + o.count + ")")
      .on("click", () => toggleKeys(o.keys))
      .on("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggleKeys(o.keys); } })
      .on("mouseenter focus", function () {
        if (touchMode) return;
        light();
        const r = this.getBoundingClientRect();
        tip.innerHTML = '<div class="t-head">' + o.head + '</div><div class="t-name">' + (o.dot ? '<span class="t-dot" style="background:' + o.dot + '"></span>' : "") + esc(o.title) + "</div>" +
          '<div class="t-row"><b>' + o.count + "</b> " + o.unit + "</div>" +
          '<div class="t-row" style="margin-top:6px">' + o.list.map(esc).join(" · ") + "</div>" +
          '<div class="t-row" style="margin-top:6px;color:var(--dim)">clic = filtrar el mapa</div>';
        tip.classList.add("show");
        tip.style.left = Math.max(8, Math.min(r.left, window.innerWidth - 300)) + "px";
        tip.style.top = Math.max(8, r.top - tip.offsetHeight - 12) + "px";
      })
      .on("mouseleave blur", () => { if (!selected) highlight(null); tip.classList.remove("show"); });
  }
  const plural = (n, one, many) => n === 1 ? one : many;

  addHead("Forma");
  // Forma → which filter keys it stands for ("Persona / holding" = every plain ring with a dot)
  const SHAPE_OWN = ["hub", "offshore", "state", "regulator", "satellite"];
  const shapeKeys = k => k === "flow" ? ["flow"]
    : k === "person" ? GROUP_ORDER.filter(g => !SHAPE_OWN.includes(g)).map(g => "group:" + g)
    : ["group:" + k];
  [
    { k: "hub", label: "Banco núcleo" },
    { k: "state", label: "Fondos del Estado" },
    { k: "offshore", label: "Offshore" },
    { k: "regulator", label: "Regulador" },
    { k: "person", label: "Persona / holding" },
    { k: "satellite", label: "Empresa satélite" },
    { k: "flow", label: "Dinero" },
    { k: "tie", label: "Vínculo" }
  ].forEach(it => {
    if (it.k === "tie") {   // not a filter: just explains the dashed gray lines
      const row = legend.append("div").attr("class", "item").attr("title", "Familia, propiedad, cargos y otros vínculos que no son dinero");
      const s = row.append("svg").attr("width", 30).attr("height", 18);
      s.append("line").attr("x1", 0).attr("x2", 23).attr("y1", 9).attr("y2", 9).attr("stroke", "#8A8F98").attr("stroke-width", 1.6).attr("stroke-dasharray", "4 3");
      s.append("path").attr("d", "M23,6L29,9L23,12Z").attr("fill", "#8A8F98");
      row.append("span").text(it.label);
      return;
    }
    const row = legend.append("div").attr("class", "item pick");
    const s = row.append("svg").attr("width", it.k === "flow" ? 30 : 18).attr("height", 18);
    if (it.k === "flow") {
      s.append("line").attr("x1", 0).attr("x2", 22).attr("y1", 9).attr("y2", 9).attr("stroke", "#fff").attr("stroke-width", 2);
      s.append("path").attr("d", "M22,5L30,9L22,13Z").attr("fill", "#fff");
    } else {
      const sat = it.k === "satellite";
      const c = s.append("circle").attr("cx", 9).attr("cy", 9).attr("r", 7)
        .attr("fill", sat ? "#fff" : "none").attr("stroke", "#fff").attr("stroke-width", 1.6);
      if (it.k === "offshore") c.attr("stroke-dasharray", "3 2.5");
      if (it.k === "hub" || it.k === "state") s.append("circle").attr("cx", 9).attr("cy", 9).attr("r", 10).attr("fill", "none").attr("stroke", "#fff").attr("stroke-width", .8).attr("stroke-dasharray", it.k === "state" ? "1 2.5" : null);
      if (it.k === "regulator") s.append("rect").attr("x", 7).attr("y", 7).attr("width", 4).attr("height", 4).attr("fill", "#fff");
      else s.append("circle").attr("cx", 9).attr("cy", 9).attr("r", it.k === "hub" ? 2.5 : 1.5).attr("fill", sat ? "#000" : "#fff");
    }
    row.append("span").text(it.label);

    const keys = shapeKeys(it.k);
    const isFlow = it.k === "flow";
    const members = isFlow ? nodes.filter(n => moneyNodes.has(n.id)) : nodes.filter(n => keys.some(g => FILTERS[g](n)));
    bindPick(row, {
      keys, head: "FORMA", title: it.label,
      nodeIds: members.map(n => n.id), links: isFlow ? moneyLinks : null,
      count: isFlow ? moneyLinks.size : members.length,
      unit: isFlow ? plural(moneyLinks.size, "vínculo de dinero", "vínculos de dinero") : plural(members.length, "entidad", "entidades"),
      list: members.map(display)
    });
  });

  // Color dots live on the same row
  legend.append("div").attr("class", "sep");
  addHead("Color");
  const dotsBox = legend.append("div").attr("class", "dots");
  CAT_ORDER.forEach(k => {
    const members = nodes.filter(n => n.cat === k);
    bindPick(dotsBox.append("i").attr("class", "dot").style("background", CATS[k].color), {
      keys: ["cat:" + k], head: "COLOR", title: CATS[k].name, dot: CATS[k].color,
      nodeIds: members.map(n => n.id), count: members.length,
      unit: plural(members.length, "entidad", "entidades"), list: members.map(display)
    });
  });
  applyFilter(false);   // paint the pressed state on the new legend items

  /* ---------- clock ---------- */
  const clock = document.getElementById("clock");
  setInterval(() => clock.textContent = ts(), 1000);
  clock.textContent = ts();

  /* ---------- resize ---------- */
  let rz;
  window.addEventListener("resize", () => {
    W = stage.clientWidth; H = stage.clientHeight;
    drawGrid();
    clearTimeout(rz); rz = setTimeout(() => fitView(true), 200);
  });

  /* ================================================================
     SEARCH
     Accent-insensitive: "vazquez" finds "Vázquez", "itaipu" finds "Itaipú".
     Searches names, roles, groups and connection descriptions (amounts too).
     ================================================================ */
  const q = document.getElementById("q");
  const qCount = document.getElementById("q-count");
  const qClear = document.getElementById("q-clear");
  const results = document.getElementById("results");
  const fold = s => s.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();

  nodes.forEach(n => n.hay = fold([n.label, n.short || "", n.role, n.id, GROUPS[n.group].name, CATS[n.cat].name, n.code].join(" ")));
  links.forEach(l => l.hay = fold([l.desc, l.code, l.source.label, l.target.label, ...l.sources.map(s => s.medio + " " + s.titulo)].join(" ")));

  let hits = [], cursorIdx = -1;

  // Wrap matched text in <mark>, using accent-folded positions
  function mark(text, term) {
    const f = fold(text), i = f.indexOf(term);
    if (!term || i < 0) return esc(text);
    return esc(text.slice(0, i)) + "<mark>" + esc(text.slice(i, i + term.length)) + "</mark>" + esc(text.slice(i + term.length));
  }

  function runSearch() {
    const raw = q.value.trim();
    const terms = fold(raw).split(/\s+/).filter(Boolean);
    qClear.hidden = !raw;
    document.getElementById("q-key").hidden = !!raw;
    if (!terms.length) {
      hits = []; results.hidden = true; q.setAttribute("aria-expanded", "false");
      qCount.textContent = "";
      highlight(selected);
      return;
    }
    const match = hay => terms.every(tm => hay.includes(tm));
    const nHits = nodes.filter(n => match(n.hay));
    const lHits = links.filter(l => match(l.hay));

    // Map: matching nodes + matching links (and their endpoints)
    const ns = new Set(nHits.map(n => n.id)), ls = new Set(lHits);
    lHits.forEach(l => { ns.add(l.source.id); ns.add(l.target.id); });
    highlight({ type: "search", nodes: ns, links: ls });

    const first = terms[0];
    hits = [
      ...nHits.map(n => ({ kind: "node", n })),
      ...lHits.map(l => ({ kind: "link", l }))
    ];
    qCount.textContent = hits.length + (hits.length === 1 ? " RESULTADO" : " RESULTADOS");

    let html = "";
    if (!hits.length) html = '<div class="r-empty">Sin coincidencias para "' + esc(raw) + '".</div>';
    if (nHits.length) html += '<div class="r-head">Entidades [' + two(nHits.length) + "]</div>";
    hits.forEach((h, i) => {
      if (h.kind === "link" && (i === 0 || hits[i - 1].kind !== "link")) html += '<div class="r-head">Vínculos [' + two(lHits.length) + "]</div>";
      if (h.kind === "node") {
        const n = h.n;
        html += '<div class="r" role="option" data-i="' + i + '"><div class="r-top"><span class="r-dot" style="background:' + CATS[n.cat].color + '"></span><span class="r-code">' + n.code + '</span><span class="r-name">' + mark(n.label, first) + '</span>' + (isHidden(n) ? '<span class="r-off">oculto</span>' : "") + '</div>' +
                '<div class="r-sub">' + mark(n.role, first) + "</div></div>";
      } else {
        const l = h.l;
        const sub = l.amounts.length ? l.amounts.join(" + ") : l.desc;
        html += '<div class="r" role="option" data-i="' + i + '"><div class="r-top"><span class="r-code">' + l.code + '</span><span class="r-name">' + esc(display(l.source)) + " → " + esc(display(l.target)) + '</span>' + (linkHidden(l) ? '<span class="r-off">oculto</span>' : "") + '</div>' +
                '<div class="r-sub">' + mark(sub, first) + "</div></div>";
      }
    });
    results.innerHTML = html;
    results.hidden = false;
    q.setAttribute("aria-expanded", "true");
    setCursor(hits.length ? 0 : -1);
  }

  function setCursor(i) {
    cursorIdx = i;
    results.querySelectorAll(".r").forEach(el => el.classList.toggle("on", +el.dataset.i === i));
    const el = results.querySelector('.r[data-i="' + i + '"]');
    if (el) el.scrollIntoView({ block: "nearest" });
  }

  // Smoothly bring an entity (or a link's midpoint) to the centre of the map
  function centerOn(x, y) {
    const [kMin, kMax] = zoom.scaleExtent();
    const k = Math.min(kMax, Math.max(d3.zoomTransform(svg.node()).k, 0.85, kMin));
    const t = d3.zoomIdentity.translate(W / 2 - k * x, H / 2 - k * y).scale(k);
    svg.transition().duration(700).call(zoom.transform, zoom.constrain()(t, [[0, 0], [W, H]], zoom.translateExtent()));
  }

  function choose(i) {
    const h = hits[i];
    if (!h) return;
    closeResults();
    if (h.kind === "node") { select(h.n.id); centerOn(h.n.x, h.n.y); }
    else { selectLink(h.l); centerOn((h.l.source.x + h.l.target.x) / 2, (h.l.source.y + h.l.target.y) / 2); }
    q.blur();
  }

  function closeResults() {
    results.hidden = true; q.setAttribute("aria-expanded", "false");
  }

  function clearSearch() {
    q.value = "";
    runSearch();
  }

  q.addEventListener("input", runSearch);
  q.addEventListener("focus", () => { if (q.value.trim()) runSearch(); });
  q.addEventListener("keydown", e => {
    if (e.key === "ArrowDown") { e.preventDefault(); if (hits.length) setCursor((cursorIdx + 1) % hits.length); }
    else if (e.key === "ArrowUp") { e.preventDefault(); if (hits.length) setCursor((cursorIdx - 1 + hits.length) % hits.length); }
    else if (e.key === "Enter") { e.preventDefault(); choose(cursorIdx < 0 ? 0 : cursorIdx); }
    else if (e.key === "Escape") { e.stopPropagation(); if (q.value) clearSearch(); else q.blur(); }
  });
  results.addEventListener("mousedown", e => {
    const el = e.target.closest(".r");
    if (el) { e.preventDefault(); choose(+el.dataset.i); }
  });
  results.addEventListener("mousemove", e => {
    const el = e.target.closest(".r");
    if (el && +el.dataset.i !== cursorIdx) setCursor(+el.dataset.i);
  });
  q.addEventListener("blur", () => setTimeout(closeResults, 120));
  qClear.addEventListener("click", () => { clearSearch(); q.focus(); });
  document.addEventListener("keydown", e => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.target.matches && e.target.matches('input[type="text"], textarea, [contenteditable]')) return;   // the reader is typing
    if (e.key === "/" || e.key.toLowerCase() === "f") { e.preventDefault(); openFilter(false); q.focus(); q.select(); }
  });

  homeScreen();
})();
</script>
</body>
</html>
